name: Narrator Desktop
on:
  push:
    branches: [feature/tauri-studio]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Python contracts
        run: python -m unittest discover -s tests -v
      - name: Rust contracts
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Format Rust source
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Frontend contracts
        run: |
          npm ci --prefix desktop
          npm test --prefix desktop
          npm run build --prefix desktop
      - name: Package Python bridge
        run: |
          python -m pip install pyinstaller==6.16.0
          python scripts/build_bridge.py
      - name: Build Windows desktop
        run: |
          python scripts/collect_notices.py
          desktop/node_modules/.bin/tauri build --features desktop --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: narrator-studio-windows
          path: |
            src-tauri/target/release/NarratorStudio.exe
            src-tauri/target/release/narrator-bridge.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/resources/THIRD_PARTY_NOTICES.txt
